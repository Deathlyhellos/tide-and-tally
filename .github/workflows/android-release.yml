name: Android release build

# Builds Tide & Tally into a debug APK (sideload / test on a phone) and a
# release AAB (upload to Play Console). No Android Studio needed: the
# GitHub-hosted runner has the Android SDK, and this workflow scaffolds the
# native Capacitor project from the web files in this repo on every run.
#
# Run it manually: repo > Actions > "Android release build" > Run workflow.
#
# Signing: the release AAB is signed only when these repository secrets
# exist (Settings > Secrets and variables > Actions). Without them the AAB
# is built unsigned and Play Console will reject it — the run summary says
# so plainly. See WIRING-PLAY-BILLING-AND-ADMOB.md for how to create the
# keystore and these secrets (one-time setup).
#   ANDROID_KEYSTORE_BASE64  — base64 of the upload keystore (.jks) file
#   ANDROID_KEY_ALIAS        — key alias inside the keystore
#   ANDROID_KEYSTORE_PASSWORD — keystore password
#   ANDROID_KEY_PASSWORD     — key password (often the same as the keystore password)
#
# AdMob: the AdMob App ID is injected into AndroidManifest.xml at build
# time. Set the repository variable ADMOB_APP_ID (Settings > Secrets and
# variables > Actions > Variables) to the production App ID before a real
# release; without it the build uses Google's test App ID, which is only
# for testing and must never ship.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "What to build"
        type: choice
        options:
          - aab-and-apk
          - aab-only
          - apk-only
        default: aab-and-apk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 21 (Capacitor 8 / AGP 8.13)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Stage web assets for Capacitor (webDir is www/)
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/

      - name: Install dependencies
        run: npm ci

      - name: Scaffold and sync the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set versionName to 1.0.0
        run: |
          sed -i 's/versionName "1.0"/versionName "1.0.0"/' android/app/build.gradle
          grep -n 'versionCode\|versionName' android/app/build.gradle

      - name: Inject AdMob App ID into AndroidManifest.xml
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: |
          if [ -z "$ADMOB_APP_ID" ]; then
            ADMOB_APP_ID="ca-app-pub-3940256099942544~3347511713"
            echo "No ADMOB_APP_ID variable set — using Google's test App ID (testing only, do not ship)."
          fi
          echo "ADMOB_APP_ID=$ADMOB_APP_ID" >> "$GITHUB_ENV"
          python3 - << 'EOF'
          import os
          import pathlib
          app_id = os.environ["ADMOB_APP_ID"]
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              meta = (
                  '        <meta-data\n'
                  '            android:name="com.google.android.gms.ads.APPLICATION_ID"\n'
                  f'            android:value="{app_id}" />\n'
              )
              text = text.replace("    </application>", meta + "    </application>", 1)
              p.write_text(text)
              print("AdMob App ID injected into AndroidManifest.xml")
          else:
              print("AdMob App ID already present in AndroidManifest.xml")
          EOF

      - name: Build debug APK
        if: ${{ inputs.build_type != 'aab-only' }}
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace

      - name: Build release AAB
        if: ${{ inputs.build_type != 'apk-only' }}
        run: |
          cd android
          ./gradlew :app:bundleRelease --stacktrace

      - name: Sign release AAB
        if: ${{ inputs.build_type != 'apk-only' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Warn if release AAB is unsigned
        if: ${{ inputs.build_type != 'apk-only' && secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          {
            echo "## ⚠️ Release AAB is UNSIGNED"
            echo "No ANDROID_KEYSTORE_BASE64 secret is set, so the AAB in the"
            echo "artifacts cannot be uploaded to Play Console. Add the four"
            echo "ANDROID_* secrets (see WIRING-PLAY-BILLING-AND-ADMOB.md)"
            echo "and run this workflow again."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        if: ${{ inputs.build_type != 'aab-only' }}
        uses: actions/upload-artifact@v4
        with:
          name: tide-and-tally-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release AAB
        if: ${{ inputs.build_type != 'apk-only' }}
        uses: actions/upload-artifact@v4
        with:
          name: tide-and-tally-release-aab
          path: android/app/build/outputs/bundle/release/
